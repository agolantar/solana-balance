<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Solana Баланс Чекер</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #1a1a1a;
            color: #ffffff;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .container {
            background-color: #2d2d2d;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
            text-align: center;
            width: 90%;
            max-width: 400px;
        }
        h1 {
            color: #14F195;
            font-size: 24px;
            margin-bottom: 20px;
        }
        input {
            width: 100%;
            padding: 10px;
            margin-bottom: 15px;
            border: 1px solid #444;
            border-radius: 5px;
            background-color: #1a1a1a;
            color: white;
            box-sizing: border-box;
        }
        button {
            width: 100%;
            padding: 10px;
            background-color: #9945FF;
            color: white;
            border: none;
            border-radius: 5px;
            font-weight: bold;
            cursor: pointer;
            font-size: 16px;
        }
        button:hover {
            background-color: #7a32cc;
        }
        .result {
            margin-top: 20px;
            font-size: 18px;
            font-weight: bold;
            word-break: break-word;
        }
        .error {
            color: #ff4d4d;
        }
    </style>
</head>
<body>

<div class="container">
    <h1>Проверка баланса Solana</h1>
    <input type="text" id="walletAddress" placeholder="Введите адрес кошелька Solana">
    <button onclick="checkBalance()">Узнать баланс</button>
    <div id="result" class="result"></div>
</div>

<script>
    async function checkBalance() {
        const addressInput = document.getElementById('walletAddress').value.trim();
        const resultDiv = document.getElementById('result');
        
        resultDiv.innerHTML = "Загрузка данных из блокчейна...";
        resultDiv.className = "result";

        if (!addressInput || addressInput.length < 32 || addressInput.length > 44) {
            resultDiv.innerHTML = "Пожалуйста, введите корректный адрес Solana.";
            resultDiv.className = "result error";
            return;
        }

        // Правильные полные технические адреса блокчейн-узлов (RPC) Solana
        const rpcEndpoints = [
            "https://solana.com",
            "https://blink.xyz"
        ];

        const requestData = {
            jsonrpc: "2.0",
            id: 1,
            method: "getBalance",
            params: [addressInput]
        };

        let success = false;

        for (let rpcUrl of rpcEndpoints) {
            try {
                const response = await fetch(rpcUrl, {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify(requestData)
                });

                if (!response.ok) {
                    console.warn(`Узел ${rpcUrl} вернул статус ${response.status}`);
                    continue;
                }

                const data = await response.json();
                if (data.error) {
                    console.warn(`Узел ${rpcUrl} вернул ошибку RPC:`, data.error);
                    continue;
                }

                const lamports = data.result.value;
                const sol = lamports / 1000000000;

                resultDiv.innerHTML = `Баланс: <span style="color: #14F195;">${sol.toFixed(4)} SOL</span>`;
                success = true;
                break; 
            } catch (e) {
                console.warn(`Не удалось подключиться к ${rpcUrl}, пробуем следующий...`);
            }
        }

        if (!success) {
            resultDiv.innerHTML = "Ошибка: не удалось получить данные из блокчейна. Попробуйте еще раз.";
            resultDiv.className = "result error";
        }
    }
</script>

</body>
</html>
